[project]
name = "environment-metadata-provider"
version = "0.1.1"
description = "Collects hostname, process ID, Python version, and boot time once at startup, exposing them as a frozen dict for log record enrichment."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
